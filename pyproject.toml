[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vulnometry"
version = "0.1.0"
description = "Vulnometry measures what a vulnerability is worth to your business, not how severe it is in the abstract. Business Exposure Index scoring, scanner intake, Excel bulk analysis, and an offline dashboard."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Sanjay Babu", email = "sanjaybabu.1997@gmail.com" }]
keywords = ["vulnerability-management", "exposure", "risk", "epss", "kev", "sbom", "security", "mcp"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "Topic :: Security",
  "Programming Language :: Python :: 3.10",
]
dependencies = [
  "httpx>=0.27",
  "rich>=13.0",
  "openpyxl>=3.1",
  "PyYAML>=6.0",
]

[project.urls]
Homepage = "https://github.com/san3ncrypt3d/vulnometry"
Repository = "https://github.com/san3ncrypt3d/vulnometry"
Issues = "https://github.com/san3ncrypt3d/vulnometry/issues"
Changelog = "https://github.com/san3ncrypt3d/vulnometry/blob/main/CHANGELOG.md"

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
service = ["fastapi>=0.110", "uvicorn>=0.29"]
all = ["boto3>=1.34", "fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8.0"]

[project.scripts]
vulnometry = "vulnometry.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnometry"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = [
  "E501",    # line length is handled by the formatter, not enforced here
  "B008",    # FastAPI and argparse both rely on calls in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
